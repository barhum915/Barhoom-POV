<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BKKARI POV — تصوير الرحلات والمغامرات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --ink:#060a10; --ink-2:#0c141f; --ink-3:#101b28;
  --gold:#c6a15b; --gold-2:#e8c77e; --gold-dim:#8a6f3c;
  --teal:#0e3b3e; --teal-2:#1b6b6e;
  --sand:#efe7d6; --muted:#93a1ab;
  --line:rgba(198,161,91,0.18);
  --shadow:0 20px 60px rgba(0,0,0,.5);
  --ok:#4fae6a; --bad:#e0483a; --wait:#c6a15b;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;} }
body{background:var(--ink); color:var(--sand); font-family:'Tajawal',sans-serif; overflow-x:hidden; position:relative;}
::selection{background:var(--gold); color:var(--ink);}
::-webkit-scrollbar{width:9px;}
::-webkit-scrollbar-track{background:var(--ink);}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--gold-dim),var(--gold)); border-radius:10px;}
h1,h2,h3,.font-display{font-family:'Amiri',serif;}
a{color:inherit; text-decoration:none;}
img,video{display:block; max-width:100%;}
button{font-family:inherit; cursor:pointer; border:none;}
.container{max-width:1180px; margin:0 auto; padding:0 24px;}
.eyebrow{display:inline-flex; align-items:center; gap:10px; color:var(--gold-2); letter-spacing:.5px; font-weight:700; font-size:.85rem; margin-bottom:14px;}
.eyebrow::before{content:''; width:26px; height:1px; background:var(--gold);}
.section-title{font-size:clamp(1.9rem,4vw,3rem); line-height:1.25; margin-bottom:14px; color:var(--sand);}
.section-title .accent{color:var(--gold-2);}
.section-sub{color:var(--muted); font-size:1.05rem; max-width:640px; line-height:1.9; margin-bottom:48px;}
.section{padding:120px 0; position:relative;}
#particles{position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden;}
.dust{position:absolute; width:3px; height:3px; border-radius:50%; background:var(--gold-2); opacity:0; filter:blur(.5px); animation:float-up linear infinite;}
@keyframes float-up{0%{transform:translateY(0) translateX(0); opacity:0;}10%{opacity:.55;}90%{opacity:.35;}100%{transform:translateY(-100vh) translateX(20px); opacity:0;}}
.horizon{position:relative; height:90px; margin-top:-1px;}
.horizon svg{width:100%; height:100%; display:block;}
.horizon path{fill:none; stroke:var(--gold); stroke-width:1.4; opacity:.55; stroke-dasharray:2000; stroke-dashoffset:2000; transition:stroke-dashoffset 1.8s cubic-bezier(.16,1,.3,1);}
.horizon.drawn path{stroke-dashoffset:0;}
.horizon .sun{fill:var(--gold-2); opacity:0; transform-origin:center; transition:opacity 1.2s ease 1s, transform 1.6s cubic-bezier(.16,1,.3,1) .6s; transform:translateY(6px) scale(.8);}
.horizon.drawn .sun{opacity:.85; transform:translateY(0) scale(1);}
header{position:fixed; top:0; inset-inline:0; z-index:100; padding:18px 0; transition:background .4s ease, padding .4s ease, box-shadow .4s ease;}
header.scrolled{background:rgba(6,10,16,.86); backdrop-filter:blur(14px); padding:12px 0; box-shadow:0 8px 30px rgba(0,0,0,.35); border-bottom:1px solid var(--line);}
.nav-inner{display:flex; align-items:center; justify-content:space-between;}
.brand{display:flex; align-items:center; gap:12px; font-family:'Amiri',serif; font-size:1.4rem; color:var(--sand); font-weight:700; letter-spacing:.5px;}
.compass{width:34px; height:34px; animation:spin-slow 30s linear infinite;}
@keyframes spin-slow{to{transform:rotate(360deg);}}
.nav-links{display:flex; gap:30px; font-size:.95rem;}
.nav-links a{position:relative; color:var(--sand); opacity:.85; transition:opacity .3s, color .3s;}
.nav-links a::after{content:''; position:absolute; right:0; bottom:-6px; width:0; height:1px; background:var(--gold); transition:width .35s ease;}
.nav-links a:hover{opacity:1; color:var(--gold-2);}
.nav-links a:hover::after{width:100%;}
.nav-cta{border:1px solid var(--gold); color:var(--gold-2); padding:10px 22px; border-radius:30px; font-size:.9rem; font-weight:700; transition:all .35s ease; position:relative; overflow:hidden;}
.nav-cta:hover{color:var(--ink); box-shadow:0 0 24px rgba(198,161,91,.5);}
.nav-cta::before{content:''; position:absolute; inset:0; background:var(--gold); transform:translateY(101%); transition:transform .35s ease; z-index:-1;}
.nav-cta:hover::before{transform:translateY(0);}
.burger{display:none; width:26px; height:20px; flex-direction:column; justify-content:space-between; background:none;}
.burger span{height:2px; background:var(--gold); width:100%; border-radius:2px;}
.hero{position:relative; min-height:100svh; display:flex; align-items:center; overflow:hidden; isolation:isolate;}
.hero-media{position:absolute; inset:0; z-index:-2;}
.hero-media video, .hero-media img{width:100%; height:100%; object-fit:cover; position:absolute; inset:0; animation:hero-zoom 22s ease-in-out infinite alternate;}
@keyframes hero-zoom{from{transform:scale(1);} to{transform:scale(1.12);}}
.hero-scrim{position:absolute; inset:0; z-index:-1; background:linear-gradient(180deg, rgba(6,10,16,.55) 0%, rgba(6,10,16,.35) 35%, rgba(6,10,16,.75) 78%, var(--ink) 100%), linear-gradient(90deg, rgba(6,10,16,.55), rgba(6,10,16,.15) 45%, rgba(6,10,16,.55));}
.hero-content{max-width:820px; padding-top:90px;}
.hero-kicker{display:flex; align-items:center; gap:12px; color:var(--gold-2); font-weight:700; letter-spacing:2px; font-size:.8rem; margin-bottom:22px; opacity:0; animation:rise .9s ease .2s forwards;}
.hero-kicker .rope{width:50px; height:1px; background:linear-gradient(90deg,var(--gold),transparent);}
.hero h1{font-size:clamp(2.6rem,6.2vw,5rem); line-height:1.2; color:var(--sand); font-weight:700; text-shadow:0 10px 40px rgba(0,0,0,.5); opacity:0; animation:rise 1s ease .4s forwards;}
.hero h1 .glow{background:linear-gradient(100deg,var(--gold-dim),var(--gold-2) 40%,var(--gold-dim)); background-size:220% auto; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shimmer 5s linear infinite;}
@keyframes shimmer{to{background-position:-220% center;}}
.hero p.lead{margin-top:26px; font-size:1.2rem; color:var(--sand); opacity:0; max-width:600px; line-height:2; animation:rise 1s ease .65s forwards;}
.hero-actions{display:flex; gap:18px; margin-top:42px; flex-wrap:wrap; opacity:0; animation:rise 1s ease .9s forwards;}
@keyframes rise{from{opacity:0; transform:translateY(26px);} to{opacity:1; transform:translateY(0);}}
.btn{display:inline-flex; align-items:center; gap:10px; padding:17px 34px; border-radius:6px; font-weight:700; font-size:1rem; position:relative; overflow:hidden; transition:transform .3s ease, box-shadow .3s ease;}
.btn:active{transform:scale(.97);}
.btn-gold{background:linear-gradient(135deg,var(--gold-2),var(--gold)); color:var(--ink);}
.btn-gold:hover{box-shadow:0 14px 40px rgba(198,161,91,.4); transform:translateY(-3px);}
.btn-ghost{border:1px solid rgba(239,231,214,.35); color:var(--sand); backdrop-filter:blur(6px); background:rgba(255,255,255,.03);}
.btn-ghost:hover{border-color:var(--gold); color:var(--gold-2); transform:translateY(-3px);}
.btn-sm{padding:10px 18px; font-size:.85rem; border-radius:8px;}
.scroll-cue{position:absolute; bottom:36px; inset-inline:0; display:flex; justify-content:center; z-index:2; opacity:.8;}
.scroll-cue .stick{width:1px; height:46px; background:linear-gradient(var(--gold),transparent); position:relative; overflow:hidden;}
.scroll-cue .stick::after{content:''; position:absolute; width:100%; height:14px; background:var(--gold-2); top:-14px; animation:drip 2s ease-in-out infinite;}
@keyframes drip{0%{top:-14px;}100%{top:46px;}}
.reveal{opacity:0; transform:translateY(40px); transition:opacity .9s cubic-bezier(.16,1,.3,1), transform .9s cubic-bezier(.16,1,.3,1);}
.reveal.in{opacity:1; transform:translateY(0);}
.reveal-scale{opacity:0; transform:scale(.92); transition:opacity .8s ease, transform .8s cubic-bezier(.16,1,.3,1);}
.reveal-scale.in{opacity:1; transform:scale(1);}
.stagger > *{transition-delay:calc(var(--i,0) * 90ms);}
.price-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:22px;}
.price-card{background:linear-gradient(160deg,var(--ink-2),var(--ink-3)); border:1px solid var(--line); border-radius:16px; padding:30px 26px; position:relative; overflow:hidden; transition:transform .4s cubic-bezier(.16,1,.3,1), border-color .4s ease, box-shadow .4s ease; display:flex; flex-direction:column; gap:14px;}
.price-card::before{content:''; position:absolute; inset:0; background:radial-gradient(circle at 30% 0%, rgba(198,161,91,.12), transparent 60%); opacity:0; transition:opacity .4s ease;}
.price-card:hover{transform:translateY(-10px); border-color:var(--gold); box-shadow:var(--shadow);}
.price-card:hover::before{opacity:1;}
.price-card .num{font-family:'Amiri',serif; color:var(--gold-2); font-size:1.1rem;}
.price-card .amount{font-size:1.7rem; font-weight:800; color:var(--sand);}
.price-card .amount span{font-size:.85rem; color:var(--muted); font-weight:500;}
.price-sub{color:var(--muted); font-size:.85rem; line-height:1.6;}
.includes{margin-top:56px; background:var(--ink-2); border:1px solid var(--line); border-radius:20px; padding:44px; display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:26px;}
.includes h3{font-size:1.3rem; margin-bottom:24px; grid-column:1/-1; color:var(--gold-2); font-family:'Amiri',serif;}
.include-item{display:flex; gap:14px; align-items:flex-start;}
.include-item .dot{min-width:8px; height:8px; border-radius:50%; background:var(--gold); margin-top:9px; box-shadow:0 0 12px var(--gold);}
.include-item p{color:var(--sand); line-height:1.8; font-size:.98rem;}
.activity-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:18px;}
.activity-card{background:var(--ink-2); border:1px solid var(--line); border-radius:16px; padding:26px 18px; text-align:center; transition:all .4s cubic-bezier(.16,1,.3,1);}
.activity-card:hover{transform:translateY(-6px); border-color:var(--gold); box-shadow:var(--shadow);}
.activity-card .ic{font-size:2rem; display:block; margin-bottom:10px;}
.activity-card h4{font-family:'Amiri',serif; font-size:1.05rem; color:var(--sand);}
.pkg-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:30px;}
.pkg-card{position:relative; border-radius:22px; padding:3px; background:linear-gradient(160deg, rgba(198,161,91,.5), rgba(198,161,91,.05) 40%);}
.pkg-card .inner{background:linear-gradient(165deg,var(--ink-3),var(--ink-2)); border-radius:20px; padding:42px 34px; height:100%; transition:transform .45s cubic-bezier(.16,1,.3,1);}
.pkg-card:hover .inner{transform:translateY(-10px);}
.pkg-card.featured{background:linear-gradient(160deg,var(--gold-2),var(--gold-dim));}
.pkg-card.featured .inner{background:linear-gradient(165deg,#141014,#0c0a0d);}
.badge{position:absolute; top:-14px; right:34px; background:linear-gradient(120deg,var(--gold-2),var(--gold)); color:var(--ink); padding:8px 18px; border-radius:30px; font-weight:800; font-size:.82rem; box-shadow:0 8px 24px rgba(198,161,91,.4); display:flex; align-items:center; gap:6px;}
.pkg-icon{font-size:2.2rem; margin-bottom:18px; display:block;}
.pkg-card h3{font-family:'Amiri',serif; font-size:1.7rem; color:var(--sand); margin-bottom:6px;}
.pkg-price{color:var(--gold-2); font-size:1.9rem; font-weight:800; margin:14px 0 4px;}
.pkg-price span{font-size:.9rem; color:var(--muted); font-weight:500;}
.pkg-list{list-style:none; display:flex; flex-direction:column; gap:14px; margin-top:20px;}
.pkg-list li{display:flex; align-items:flex-start; gap:12px; color:var(--sand); line-height:1.7; font-size:.98rem;}
.pkg-list li::before{content:'✦'; color:var(--gold); flex-shrink:0; margin-top:2px;}
.pkg-card .btn{width:100%; justify-content:center; margin-top:30px;}
.glasses-section{position:relative; padding:130px 0; overflow:hidden; background:linear-gradient(180deg,var(--ink) 0%, var(--teal) 100%);}
.glasses-grid{display:grid; grid-template-columns:1.05fr .95fr; gap:60px; align-items:center;}
.glasses-visual{position:relative; border-radius:24px; overflow:hidden; box-shadow:var(--shadow); aspect-ratio:4/5;}
.glasses-visual img{width:100%; height:100%; object-fit:cover; transition:transform 8s ease;}
.glasses-visual:hover img{transform:scale(1.1);}
.glasses-visual .frame-glow{position:absolute; inset:0; border:1px solid var(--gold); border-radius:24px; opacity:.5; pointer-events:none;}
.pov-tag{position:absolute; bottom:22px; right:22px; background:rgba(6,10,16,.75); backdrop-filter:blur(8px); border:1px solid var(--gold); padding:10px 18px; border-radius:30px; font-size:.85rem; color:var(--gold-2); font-weight:700; display:flex; align-items:center; gap:8px;}
.pov-tag .rec-dot{width:8px; height:8px; border-radius:50%; background:#e0483a; animation:blink 1.4s infinite;}
@keyframes blink{50%{opacity:.2;}}
.glasses-feats{list-style:none; display:flex; flex-direction:column; gap:20px; margin-top:34px;}
.glasses-feats li{display:flex; gap:16px; align-items:flex-start; color:var(--sand); line-height:1.8;}
.glasses-feats .ic{font-size:1.3rem; margin-top:2px;}
.why-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:24px;}
.why-card{background:var(--ink-2); border:1px solid var(--line); border-radius:18px; padding:34px 28px; transition:transform .4s cubic-bezier(.16,1,.3,1), border-color .4s ease;}
.why-card:hover{transform:translateY(-8px) rotate(-.5deg); border-color:var(--gold);}
.why-card .ic{font-size:2.1rem; display:inline-block; margin-bottom:18px; transition:transform .4s ease;}
.why-card:hover .ic{transform:scale(1.15) rotate(6deg);}
.why-card h4{font-family:'Amiri',serif; font-size:1.25rem; color:var(--sand); margin-bottom:10px;}
.why-card p{color:var(--muted); line-height:1.8; font-size:.95rem;}
.filters{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:36px;}
.filter-btn{padding:9px 20px; border-radius:30px; border:1px solid var(--line); color:var(--muted); font-size:.9rem; font-weight:700; background:transparent; transition:all .3s ease;}
.filter-btn.active, .filter-btn:hover{border-color:var(--gold); color:var(--gold-2); background:rgba(198,161,91,.08);}
.gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:22px;}
.g-card{position:relative; border-radius:16px; overflow:hidden; aspect-ratio:4/5; cursor:pointer; transition:transform .5s cubic-bezier(.16,1,.3,1);}
.g-card:hover{transform:translateY(-6px);}
.g-card img,.g-card video{width:100%; height:100%; object-fit:cover; transition:transform .7s ease, filter .5s ease;}
.g-card:hover img,.g-card:hover video{transform:scale(1.12); filter:brightness(.55);}
.g-card .g-overlay{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; padding:22px; background:linear-gradient(0deg, rgba(6,10,16,.9) 5%, transparent 55%);}
.g-card .g-cat{color:var(--gold-2); font-size:.78rem; font-weight:800; letter-spacing:.5px; margin-bottom:6px; opacity:0; transform:translateY(10px); transition:all .4s ease .05s;}
.g-card .g-title{color:var(--sand); font-family:'Amiri',serif; font-size:1.1rem; opacity:0; transform:translateY(10px); transition:all .4s ease .1s;}
.g-card:hover .g-cat, .g-card:hover .g-title{opacity:1; transform:translateY(0);}
.g-card .g-play{position:absolute; top:16px; left:16px; width:38px; height:38px; border-radius:50%; background:rgba(198,161,91,.85); display:flex; align-items:center; justify-content:center; opacity:0; transform:scale(.7); transition:all .35s ease; z-index:2;}
.g-card.is-video:hover .g-play{opacity:1; transform:scale(1);}
.gallery-empty{grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--muted); border:1px dashed var(--line); border-radius:16px;}
.booking{position:relative; padding:150px 0; text-align:center; overflow:hidden; background:linear-gradient(180deg,var(--ink) 0%, var(--ink-2) 40%, var(--teal) 140%);}
.booking h2{font-size:clamp(2.2rem,5vw,3.6rem); margin-bottom:20px;}
.booking p{color:var(--muted); font-size:1.15rem; margin-bottom:14px;}
.phone-display{display:inline-flex; align-items:center; gap:14px; font-size:clamp(1.6rem,4vw,2.4rem); color:var(--gold-2); font-weight:800; margin:34px 0; letter-spacing:1px; direction:ltr; border:1px solid var(--gold); padding:18px 40px; border-radius:60px; background:rgba(198,161,91,.06);}
.booking-actions{display:flex; justify-content:center; gap:18px; flex-wrap:wrap; margin-top:12px;}
.big-cta{font-size:1.15rem; padding:22px 52px;}
.big-cta .shine{position:absolute; inset:0; background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%); transform:translateX(-120%); animation:shine 3.4s ease-in-out infinite;}
@keyframes shine{60%{transform:translateX(120%);} 100%{transform:translateX(120%);}}
.social-row{display:flex; gap:14px; justify-content:center; margin-top:26px;}
.social-row a, .foot-social a{width:40px; height:40px; border:1px solid var(--line); border-radius:50%; display:flex; align-items:center; justify-content:center; transition:all .3s ease; font-size:1.2rem; color:var(--gold-dim);}
.social-row a svg, .foot-social a svg{width:17px; height:17px;}
.social-row a:hover, .foot-social a:hover{border-color:var(--gold); color:var(--gold-2); transform:translateY(-4px);}
footer{background:var(--ink); border-top:1px solid var(--line); padding:70px 0 30px; position:relative;}
.foot-grid{display:flex; justify-content:space-between; flex-wrap:wrap; gap:40px; padding-bottom:40px;}
.foot-brand{font-family:'Amiri',serif; font-size:1.5rem; color:var(--sand); margin-bottom:12px;}
.foot-brand span{color:var(--gold-2);}
footer p{color:var(--muted); line-height:1.9; font-size:.95rem;}
.foot-social{display:flex; gap:14px; margin-top:18px;}
.foot-bottom{border-top:1px solid var(--line); padding-top:26px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; color:var(--muted); font-size:.85rem;}
.admin-link{color:var(--muted); opacity:.5; font-size:.8rem; transition:opacity .3s ease; background:none;}
.admin-link:hover{opacity:1; color:var(--gold-2);}
.wa-float{position:fixed; bottom:26px; left:26px; z-index:90; width:60px; height:60px; border-radius:50%; background:linear-gradient(135deg,var(--gold-2),var(--gold)); display:flex; align-items:center; justify-content:center; box-shadow:0 10px 30px rgba(198,161,91,.45); animation:float-y 3s ease-in-out infinite;}
@keyframes float-y{50%{transform:translateY(-8px);}}
.wa-float svg{width:28px; height:28px;}
.modal-backdrop{position:fixed; inset:0; background:rgba(4,6,10,.82); backdrop-filter:blur(6px); z-index:200; display:none; align-items:center; justify-content:center; padding:20px;}
.modal-backdrop.open{display:flex;}
.modal{background:var(--ink-2); border:1px solid var(--line); border-radius:20px; max-width:560px; width:100%; padding:36px; max-height:88vh; overflow-y:auto; position:relative; box-shadow:var(--shadow); animation:modal-in .35s cubic-bezier(.16,1,.3,1);}
.modal.wide{max-width:760px;}
@keyframes modal-in{from{opacity:0; transform:translateY(30px) scale(.96);} to{opacity:1; transform:translateY(0) scale(1);}}
.modal h3{font-family:'Amiri',serif; color:var(--gold-2); font-size:1.5rem; margin-bottom:22px;}
.modal-close{position:absolute; top:20px; left:20px; width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.06); color:var(--sand); font-size:1.2rem; display:flex; align-items:center; justify-content:center; z-index:5;}
.field{margin-bottom:18px;}
.field label{display:block; margin-
